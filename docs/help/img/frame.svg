<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Roboto, Arial, sans-serif" role="img" aria-label="The screen of the robot UI: the C frame around the map">
  <title>The C frame of the robot UI</title>
  <!-- map (the hollow of the C) -->
  <rect x="0" y="0" width="640" height="400" fill="#1c2329"/>
  <g stroke="#2a3a33" stroke-width="1">
    <path d="M190 120 H640 M190 170 H640 M190 220 H640 M190 270 H640 M250 70 V340 M330 70 V340 M410 70 V340"/>
  </g>
  <path d="M300 250 C 330 200, 380 230, 420 180" fill="none" stroke="#0dcaf0" stroke-width="2" stroke-dasharray="5 4" opacity=".7"/>
  <g transform="translate(300 250)"><circle r="9" fill="#ff7100"/><path d="M0 -6 L5 4 L0 2 L-5 4 Z" fill="#fff"/></g>
  <!-- the C: top band, left column, bottom bar (one surface) -->
  <path d="M0 0 H640 V64 H194 A14 14 0 0 0 180 78 V328 A14 14 0 0 0 194 342 H640 V400 H0 Z" fill="#282b30"/>
  <!-- navbar content -->
  <text x="14" y="22" fill="#ff7100" font-family="Bitter, Georgia, serif" font-weight="700" font-size="15">Vitulus</text>
  <g fill="#43d58b"><circle cx="452" cy="17" r="4"/><circle cx="466" cy="17" r="4"/><circle cx="480" cy="17" r="4"/></g>
  <circle cx="494" cy="17" r="4" fill="#ffab45"/>
  <text x="560" y="22" fill="#9aa4ad" font-size="13" font-weight="700">?</text>
  <path d="M584 12 a6 6 0 0 1 12 0 v6 h2 v2 h-16 v-2 h2 z" fill="#9aa4ad"/>
  <!-- menu band -->
  <g font-size="10" fill="#dee2e6">
    <rect x="10" y="36" width="56" height="22" rx="4" fill="rgba(13,202,240,.16)"/><rect x="10" y="56" width="56" height="2" fill="#0dcaf0"/>
    <text x="20" y="51">Panel</text><text x="78" y="51">Marker</text><text x="128" y="51">Settings</text><text x="184" y="51">Map</text>
    <text x="220" y="51">Programs</text><text x="276" y="51">Agent</text><text x="318" y="51">Support</text>
  </g>
  <!-- left panel -->
  <text x="14" y="94" fill="#0dcaf0" font-size="10" font-weight="700" letter-spacing=".6">MAP</text>
  <circle cx="130" cy="90" r="8" fill="none" stroke="#0dcaf0" stroke-width="1.2"/><text x="126.5" y="94" fill="#0dcaf0" font-size="10" font-weight="700">?</text>
  <text x="148" y="94" fill="#9aa4ad" font-size="11">⤢ ✕</text>
  <g font-size="9" fill="#9aa4ad"><text x="14" y="116">Map</text><text x="40" y="116">Path</text><text x="68" y="116">Point</text><text x="98" y="116">Dock</text><text x="126" y="116">Rain</text><text x="152" y="116">Loc</text></g>
  <rect x="12" y="124" width="156" height="44" rx="8" fill="#2b343c" stroke="rgba(67,213,139,.38)"/>
  <rect x="12" y="176" width="156" height="60" rx="8" fill="#2b343c" stroke="rgba(255,255,255,.1)"/>
  <rect x="12" y="244" width="156" height="70" rx="8" fill="#2b343c" stroke="rgba(255,255,255,.1)"/>
  <!-- right status panel (hangs from the top band) -->
  <path d="M500 64 H640 V236 H514 A14 14 0 0 1 500 222 Z" fill="#282b30"/>
  <g font-size="9" fill="#dee2e6"><text x="510" y="82" fill="#0dcaf0" font-weight="700">CONTROLS</text><text x="510" y="98">Slow · Mid · Fast</text>
  <text x="510" y="122" fill="#0dcaf0" font-weight="700">NAVI</text>
  <rect x="510" y="128" width="28" height="12" rx="2" fill="rgba(67,213,139,.25)"/><text x="513" y="137" fill="#43d58b">RTK</text>
  <rect x="542" y="128" width="40" height="12" rx="2" fill="rgba(67,213,139,.25)"/><text x="545" y="137" fill="#43d58b">GBAS</text>
  <text x="510" y="162" fill="#0dcaf0" font-weight="700">CAMERA</text>
  <rect x="510" y="168" width="118" height="56" rx="4" fill="#1c2329"/></g>
  <!-- small log + joystick on the bottom bar -->
  <path d="M180 342 V300 H520 V342 Z" fill="#282b30"/>
  <g font-size="8" fill="#9aa4ad"><text x="192" y="314">● 12:01 Undocked</text><text x="192" y="326">● 12:03 RTK fix</text><text x="192" y="338" fill="#ffab45">● 12:04 Battery 38 %</text></g>
  <path d="M530 342 V262 A14 14 0 0 1 544 248 H640 V342 Z" fill="#282b30"/>
  <circle cx="585" cy="295" r="34" fill="#232b32" stroke="rgba(255,255,255,.18)"/><circle cx="585" cy="295" r="13" fill="#0dcaf0" opacity=".85"/>
  <!-- bottom bar -->
  <rect x="10" y="352" width="120" height="38" rx="5" fill="#ee5f5b"/><text x="52" y="376" fill="#fff" font-weight="700" font-size="13">STOP</text>
  <g font-size="10" fill="#dee2e6"><text x="150" y="375">Joystick</text><text x="212" y="375">Follow</text><text x="264" y="375">Log</text></g>
  <!-- numbered callouts -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="410" cy="17" r="12" fill="#0dcaf0" stroke="#10181d" stroke-width="2"/><text x="410" y="22" fill="#10181d">1</text>
    <circle cx="384" cy="47" r="12" fill="#0dcaf0" stroke="#10181d" stroke-width="2"/><text x="384" y="52" fill="#10181d">2</text>
    <circle cx="90" cy="206" r="12" fill="#0dcaf0" stroke="#10181d" stroke-width="2"/><text x="90" y="211" fill="#10181d">3</text>
    <circle cx="350" cy="150" r="12" fill="#0dcaf0" stroke="#10181d" stroke-width="2"/><text x="350" y="155" fill="#10181d">4</text>
    <circle cx="600" cy="108" r="12" fill="#0dcaf0" stroke="#10181d" stroke-width="2"/><text x="600" y="113" fill="#10181d">5</text>
    <circle cx="470" cy="318" r="12" fill="#0dcaf0" stroke="#10181d" stroke-width="2"/><text x="470" y="323" fill="#10181d">6</text>
    <circle cx="585" cy="250" r="12" fill="#0dcaf0" stroke="#10181d" stroke-width="2"/><text x="585" y="255" fill="#10181d">7</text>
    <circle cx="22" cy="371" r="12" fill="#fff" stroke="#10181d" stroke-width="2"/><text x="22" y="376" fill="#ee5f5b">8</text>
  </g>
</svg>
