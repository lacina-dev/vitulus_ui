<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="Roboto, Arial, sans-serif" role="img" aria-label="A map of a garden from above: the dock, the DOCK and UNDOCK points, two mowing zones with their paths, an obstacle area, a barrier line, a saved path and the robot">
  <title>What a map holds (a garden from above)</title>
  <defs>
    <g id="n"><circle r="11" fill="#0dcaf0" stroke="#10181d" stroke-width="2"/></g>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#24313a" stroke-width="1"/></pattern>
    <pattern id="mow" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="rgba(13,202,240,.10)"/><path d="M0 5 H10" stroke="#0dcaf0" stroke-width="1.2" opacity=".7"/></pattern>
    <pattern id="mow2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(70)"><rect width="10" height="10" fill="rgba(13,202,240,.10)"/><path d="M0 5 H10" stroke="#0dcaf0" stroke-width="1.2" opacity=".7"/></pattern>
    <pattern id="obs" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="rgba(255,95,109,.18)"/><path d="M0 0 V7" stroke="#ff5f6d" stroke-width="2"/></pattern>
  </defs>
  <rect width="660" height="340" rx="12" fill="#1c2329"/>
  <rect x="10" y="10" width="640" height="320" rx="8" fill="url(#grid)"/>
  <!-- the recorded terrain (Base layer) -->
  <path d="M40 300 C 30 220, 60 120, 120 70 C 200 20, 360 30, 470 50 C 580 70, 630 140, 620 220 C 610 290, 520 316, 400 312 C 280 308, 120 320, 40 300 Z" fill="#a7c4a0" opacity=".28" stroke="#a7c4a0" stroke-opacity=".5"/>
  <!-- house edge / wall (seen by the lidar) -->
  <path d="M120 70 C 200 20, 360 30, 470 50" fill="none" stroke="#ff5f6d" stroke-width="3" opacity=".8"/>
  <!-- zones with their mowing paths -->
  <path d="M170 110 L360 90 L380 210 L190 230 Z" fill="url(#mow)" stroke="#0dcaf0" stroke-width="2"/>
  <path d="M430 110 L590 140 L570 270 L420 260 Z" fill="url(#mow2)" stroke="#0dcaf0" stroke-width="2"/>
  <!-- an obstacle area (a flower bed) inside the first zone -->
  <ellipse cx="270" cy="160" rx="34" ry="22" fill="url(#obs)" stroke="#ff5f6d" stroke-width="2"/>
  <!-- a barrier line (do not cross) -->
  <path d="M400 70 L404 272" stroke="#ffab45" stroke-width="5" stroke-dasharray="10 6" stroke-linecap="round"/>
  <!-- the dock with DOCK and UNDOCK points -->
  <path d="M56 248 H96 V256 H64 V284 H96 V292 H56 Z" fill="#2b343c" stroke="#8a939b" stroke-width="1.5"/>
  <circle cx="130" cy="270" r="7" fill="#1c2329" stroke="#ffab45" stroke-width="3"/>
  <circle cx="170" cy="262" r="7" fill="#1c2329" stroke="#43d58b" stroke-width="3"/>
  <!-- a saved path around the end of the barrier -->
  <path d="M170 262 C 260 270, 330 290, 400 300" fill="none" stroke="#e9eef2" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
  <path d="M410 300 C 450 296, 470 286, 480 270" fill="none" stroke="#e9eef2" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
  <!-- the robot -->
  <g transform="translate(250 240) rotate(-10)"><circle r="11" fill="#ff7100"/><path d="M0 -7 L6 5 L0 2 L-6 5 Z" fill="#fff" transform="rotate(90)"/></g>
  <!-- numbers -->
  <g font-weight="700" font-size="13" fill="#10181d" text-anchor="middle">
    <use href="#n" x="48" y="232"/><text x="48" y="237">1</text>
    <use href="#n" x="150" y="296"/><text x="150" y="301">2</text>
    <use href="#n" x="196" y="100"/><text x="196" y="105">3</text>
    <use href="#n" x="270" y="124"/><text x="270" y="129">4</text>
    <use href="#n" x="420" y="82"/><text x="420" y="87">5</text>
    <use href="#n" x="330" y="296"/><text x="330" y="301">6</text>
    <use href="#n" x="250" y="214"/><text x="250" y="219">7</text>
    <use href="#n" x="560" y="80"/><text x="560" y="85">8</text>
    <use href="#n" x="330" y="44"/><text x="330" y="49">9</text>
  </g>
</svg>
